<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSB — Lista de Mercado & Orçamento</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-full flex flex-col font-sans transition-colors duration-200">

    <!-- Header -->
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="p-2 bg-brand-50 dark:bg-brand-950/50 text-brand-600 dark:text-brand-400 rounded-xl text-xl font-bold">🛒</span>
                <div>
                    <h1 class="text-lg font-bold tracking-tight">RSB</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Lista inteligente com calculadora de valores</p>
                </div>
            </div>
            <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                <svg id="theme-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl w-full mx-auto px-4 py-6 flex-grow">
        
        <!-- Budget / Value Calculator Widget -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                <p class="text-xs text-slate-500 dark:text-slate-400 mb-1">Total Estimado</p>
                <p id="total-estimated" class="text-xl font-bold text-slate-800 dark:text-slate-100">R$ 0,00</p>
            </div>
            <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm border-l-4 border-l-brand-600">
                <p class="text-xs text-slate-500 dark:text-slate-400 mb-1">No Carrinho (Comprados)</p>
                <p id="total-cart" class="text-xl font-bold text-brand-600 dark:text-brand-400">R$ 0,00</p>
            </div>
        </div>

        <!-- Add Item Form -->
        <form id="item-form" class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm mb-6 space-y-3">
            <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">
                <div class="sm:col-span-4">
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Item</label>
                    <input type="text" id="item-name" placeholder="Ex: Café arábica..." required class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Qtd</label>
                    <input type="text" id="item-qty" placeholder="Ex: 2" value="1 un" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div class="sm:col-span-3">
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Preço Un. (R$)</label>
                    <input type="number" step="0.01" id="item-price" placeholder="0,00" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div class="sm:col-span-3">
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Categoria</label>
                    <select id="item-category" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                        <option value="Hortifruti">🍎 Hortifruti</option>
                        <option value="Mercearia">🍞 Mercearia</option>
                        <option value="Laticínios">🧀 Laticínios</option>
                        <option value="Açougue">🥩 Açougue</option>
                        <option value="Limpeza">🧹 Limpeza</option>
                        <option value="Bebidas">🧃 Bebidas</option>
                        <option value="Outros">📦 Outros</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-xl text-sm transition shadow-sm">Adicionar à Lista</button>
        </form>

        <!-- Actions / Filters -->
        <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-3">
            <div class="flex space-x-2 text-xs">
                <button onclick="setFilter('all')" id="filter-all" class="px-3 py-1.5 rounded-lg bg-brand-600 text-white font-medium transition">Todos</button>
                <button onclick="setFilter('pending')" id="filter-pending" class="px-3 py-1.5 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium transition">Pendentes</button>
                <button onclick="setFilter('completed')" id="filter-completed" class="px-3 py-1.5 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium transition">Comprados</button>
            </div>
            <div class="flex space-x-2 text-xs">
                <button onclick="clearCompleted()" class="text-slate-500 hover:text-red-500 dark:hover:text-red-400 transition">Limpar Comprados</button>
                <span class="text-slate-300 dark:text-slate-700">|</span>
                <button onclick="clearAll()" class="text-slate-500 hover:text-red-500 dark:hover:text-red-400 transition">Zerar Lista</button>
            </div>
        </div>

        <!-- List container -->
        <div id="items-list" class="space-y-2.5">
            <!-- Rendered dynamically -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-12">
            <p class="text-4xl mb-2">🛒</p>
            <p class="text-sm text-slate-500 dark:text-slate-400">Sua lista está vazia. Adicione itens acima!</p>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200 dark:border-slate-800 mt-auto">
        SmartMarket &bull; Hospedado no GitHub Pages
    </footer>

    <!-- Script -->
    <script>
        let items = JSON.parse(localStorage.getItem('smartmarket_items_v2')) || [
            { id: '1', name: 'Café Moído', qty: '2 pacotes', price: 15.90, category: 'Mercearia', completed: false },
            { id: '2', name: 'Leite Integral', qty: '4 litros', price: 5.50, category: 'Laticínios', completed: true },
            { id: '3', name: 'Banana Prata', qty: '1 cacho', price: 8.00, category: 'Hortifruti', completed: false }
        ];
        let currentFilter = 'all';

        const form = document.getElementById('item-form');
        const nameInput = document.getElementById('item-name');
        const qtyInput = document.getElementById('item-qty');
        const priceInput = document.getElementById('item-price');
        const categoryInput = document.getElementById('item-category');
        const listContainer = document.getElementById('items-list');
        const emptyState = document.getElementById('empty-state');
        const totalEstimatedEl = document.getElementById('total-estimated');
        const totalCartEl = document.getElementById('total-cart');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const newItem = {
                id: Date.now().toString(),
                name: nameInput.value.trim(),
                qty: qtyInput.value.trim() || '1 un',
                price: parseFloat(priceInput.value) || 0,
                category: categoryInput.value,
                completed: false
            };
            items.push(newItem);
            saveAndRender();
            nameInput.value = '';
            qtyInput.value = '1 un';
            priceInput.value = '';
            nameInput.focus();
        });

        function toggleItem(id) {
            items = items.map(item => item.id === id ? { ...item, completed: !item.completed } : item);
            saveAndRender();
        }

        function deleteItem(id) {
            items = items.filter(item => item.id !== id);
            saveAndRender();
        }

        function clearCompleted() {
            items = items.filter(item => !item.completed);
            saveAndRender();
        }

        function clearAll() {
            if (confirm('Deseja realmente limpar toda a lista?')) {
                items = [];
                saveAndRender();
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            ['all', 'pending', 'completed'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filter) {
                    btn.className = 'px-3 py-1.5 rounded-lg bg-brand-600 text-white font-medium transition';
                } else {
                    btn.className = 'px-3 py-1.5 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium transition';
                }
            });
            render();
        }

        function updateTotals() {
            const totalEstimated = items.reduce((sum, item) => sum + (Number(item.price) || 0), 0);
            const totalCart = items.filter(item => item.completed).reduce((sum, item) => sum + (Number(item.price) || 0), 0);

            totalEstimatedEl.textContent = totalEstimated.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            totalCartEl.textContent = totalCart.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function saveAndRender() {
            localStorage.setItem('smartmarket_items_v2', JSON.stringify(items));
            render();
        }

        function render() {
            updateTotals();
            listContainer.innerHTML = '';
            const filtered = items.filter(item => {
                if (currentFilter === 'pending') return !item.completed;
                if (currentFilter === 'completed') return item.completed;
                return true;
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-3.5 rounded-2xl border transition bg-white dark:bg-slate-900 ${item.completed ? 'border-slate-200 dark:border-slate-800 opacity-60' : 'border-slate-200 dark:border-slate-800 shadow-sm'}`;
                
                const formattedPrice = (Number(item.price) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

                div.innerHTML = `
                    <div class="flex items-center space-x-3 cursor-pointer flex-grow" onclick="toggleItem('${item.id}')">
                        <input type="checkbox" ${item.completed ? 'checked' : ''} class="w-4 h-4 text-brand-600 rounded focus:ring-brand-500 accent-brand-600 pointer-events-none">
                        <div>
                            <p class="text-sm font-medium ${item.completed ? 'line-through text-slate-400 dark:text-slate-500' : ''}">${escapeHtml(item.name)}</p>
                            <span class="text-xs text-slate-400 dark:text-slate-500">${escapeHtml(item.category)} &bull; Qtd: ${escapeHtml(item.qty)}</span>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="text-sm font-semibold text-slate-700 dark:text-slate-300">${formattedPrice}</span>
                        <button onclick="deleteItem('${item.id}')" class="p-2 text-slate-400 hover:text-red-500 transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        // Init theme
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        render();
    </script>
</body>
</html>
